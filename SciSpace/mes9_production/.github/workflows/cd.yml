name: CD Pipeline - Deployment
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".gitignore"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bps-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=ref,event=branch
          type=sha
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
    
    - name: Update staging deployment
      run: |
        kubectl set image deployment/bps-api \
          api=${{ needs.build-and-push.outputs.image-tag }} \
          -n bps-staging --record
        
        kubectl rollout status deployment/bps-api -n bps-staging --timeout=5m
    
    - name: Smoke test
      run: |
        kubectl port-forward -n bps-staging svc/bps-api 8000:8000 &
        sleep 5
        curl -f http://localhost:8000/health || exit 1

  deploy-production:
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
    
    - name: Check current deployment
      id: current
      run: |
        CURRENT_IMAGE=$(kubectl get deployment/bps-api -n bps-prod \
          -o jsonpath='{.spec.template.spec.containers[0].image}')
        echo "current-image=$CURRENT_IMAGE" >> $GITHUB_OUTPUT
    
    - name: Blue-Green Deployment
      run: |
        # New deployment (green)
        kubectl set image deployment/bps-api \
          api=${{ needs.build-and-push.outputs.image-tag }} \
          -n bps-prod --record
        
        # Wait for rollout
        kubectl rollout status deployment/bps-api -n bps-prod --timeout=10m
    
    - name: Post-deployment verification
      run: |
        kubectl get pods -n bps-prod
        kubectl port-forward -n bps-prod svc/bps-api 8000:8000 &
        sleep 5
        
        # Health check
        curl -f http://localhost:8000/health || exit 1
        
        # Readiness check
        curl -f http://localhost:8000/health/ready || exit 1
    
    - name: Notify deployment
      if: success()
      run: |
        echo "✅ Production deployment successful"
        echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"
