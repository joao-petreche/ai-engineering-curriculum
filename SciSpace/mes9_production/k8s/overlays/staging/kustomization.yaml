apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bps-staging

commonLabels:
  environment: staging
  managed-by: kustomize

# Base resources
resources:
- ../base/namespace.yaml
- ../base/configmap.yaml
- ../base/deployment.yaml
- ../base/postgres.yaml
- ../base/redis.yaml

# Environment-specific configuration
configMapGenerator:
- name: bps-config
  behavior: merge
  literals:
  - ENVIRONMENT=staging
  - LOG_LEVEL=INFO
  - API_WORKERS=4

replicas:
- name: bps-api
  count: 2

images:
- name: bps-api
  newTag: staging-v1.0.0
