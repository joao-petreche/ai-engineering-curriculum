apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: bps-dev
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: postgres-backup
          containers:
          - name: postgres-backup
            image: postgres:15-alpine
            command:
            - /bin/sh
            - -c
            - |
              BACKUP_DIR=/backups
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE=$BACKUP_DIR/bps_db_$TIMESTAMP.sql.gz
              
              mkdir -p $BACKUP_DIR
              
              pg_dump -h bps-postgres -U postgres -d bps_dev \
                | gzip > $BACKUP_FILE
              
              echo "Backup completed: $BACKUP_FILE"
              
              # Keep only last 7 backups
              ls -t $BACKUP_DIR/bps_db_*.sql.gz | tail -n +8 | xargs -r rm
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: bps-secrets
                  key: database-password
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-pvc
          restartPolicy: OnFailure
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-pvc
  namespace: bps-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup
  namespace: bps-dev
