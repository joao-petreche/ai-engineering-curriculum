apiVersion: batch/v1
kind: Job
metadata:
  name: bps-api-blue-green
  namespace: bps-prod
spec:
  template:
    spec:
      serviceAccountName: deployment-manager
      containers:
      - name: blue-green
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          #!/bin/sh
          set -e
          
          NEW_IMAGE=$NEW_IMAGE_TAG
          DEPLOYMENT_NAME=bps-api
          NAMESPACE=bps-prod
          
          echo "Starting Blue-Green Deployment"
          echo "New Image: $NEW_IMAGE"
          
          # Step 1: Get current (blue) image
          BLUE_IMAGE=$(kubectl get deployment $DEPLOYMENT_NAME -n $NAMESPACE \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Blue Image: $BLUE_IMAGE"
          
          # Step 2: Deploy new (green) version alongside blue
          kubectl set image deployment/$DEPLOYMENT_NAME \
            api=$NEW_IMAGE \
            -n $NAMESPACE --record
          
          echo "Waiting for green deployment to be ready..."
          kubectl rollout status deployment/$DEPLOYMENT_NAME -n $NAMESPACE --timeout=10m
          
          echo "Green deployment ready!"
          echo "Run: kubectl rollout undo deployment/$DEPLOYMENT_NAME -n $NAMESPACE"
          echo "to rollback to blue if needed."
        env:
        - name: NEW_IMAGE_TAG
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['image-tag']
      restartPolicy: Never
  backoffLimit: 3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-manager
  namespace: bps-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-manager
  namespace: bps-prod
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch", "update"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-manager
  namespace: bps-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-manager
subjects:
- kind: ServiceAccount
  name: deployment-manager
  namespace: bps-prod
