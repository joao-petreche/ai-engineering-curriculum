apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bps-tls-cert
  namespace: bps-dev
spec:
  secretName: bps-tls-secret
  duration: 2160h # 90d
  renewBefore: 720h # 30d
  commonName: api.local
  dnsNames:
  - api.local
  - "*.api.local"
  issuerRef:
    name: bps-selfsigned-issuer
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bps-selfsigned-issuer
  namespace: bps-dev
spec:
  selfSigned: {}
