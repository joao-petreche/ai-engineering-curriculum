apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bps-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/bps-api
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: bps-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  revisionHistoryLimit: 10
---
