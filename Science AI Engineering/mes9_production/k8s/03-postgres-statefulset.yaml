apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: bps-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bps-postgres
  namespace: bps-dev
spec:
  serviceName: bps-postgres
  replicas: 1
  selector:
    matchLabels:
      app: bps-postgres
  template:
    metadata:
      labels:
        app: bps-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bps-secrets
              key: database-password
        - name: POSTGRES_DB
          value: bps_dev
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: postgres
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: bps-postgres
  namespace: bps-dev
spec:
  clusterIP: None
  selector:
    app: bps-postgres
  ports:
  - port: 5432
    targetPort: 5432
