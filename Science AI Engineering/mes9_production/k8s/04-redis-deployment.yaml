apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: bps-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bps-redis
  namespace: bps-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bps-redis
  template:
    metadata:
      labels:
        app: bps-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: redis-storage
          mountPath: /data
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: bps-redis
  namespace: bps-dev
spec:
  selector:
    app: bps-redis
  ports:
  - port: 6379
    targetPort: 6379
